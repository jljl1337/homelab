services:

  ollama:
    image: docker.io/ollama/ollama:0.33.1
    container_name: homelab-ollama
    restart: unless-stopped
    devices:
      # Optional: enable NVIDIA GPU acceleration
      - nvidia.com/gpu=all 
    volumes:
      - ${FAST_TEMP_STORAGE}/ollama:/root/.ollama:Z
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: homelab-open-webui
    restart: unless-stopped
    volumes:
      - ${FAST_TEMP_STORAGE}/open-webui:/app/backend/data:Z
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true # Comment this line to disable login (not recommended)
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`ai.${DOMAIN_NAME}`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
