services:
  vaultwarden:
    image: docker.io/vaultwarden/server:1.37.3
    container_name: homelab-vaultwarden
    restart: unless-stopped
    user: ${PUID}:${PGID}
    volumes:
      - ${MASS_BACKUP_STORAGE}/data/vaultwarden:/data:z
    environment:
      - SIGNUPS_ALLOWED=false # Comment this line to allow signups
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${DOMAIN_NAME}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
