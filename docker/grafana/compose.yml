services:

  grafana:
    image: docker.io/grafana/grafana:13.1.3
    container_name: homelab-grafana
    restart: unless-stopped
    user: 0:0
    depends_on:
      - prometheus
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro,Z
      - ${FAST_TEMP_STORAGE}/grafana:/var/lib/grafana:rw,Z
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/home.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_NAME}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  prometheus:
    image: docker.io/prom/prometheus:v3.13.2
    container_name: homelab-prometheus
    restart: unless-stopped
    user: 0:0
    extra_hosts:
      - "host.docker.internal:10.0.2.2"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ${FAST_TEMP_STORAGE}/prometheus:/prometheus:rw,Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN_NAME}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: homelab-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /run/user/${PUID}/docker.sock:/var/run/docker.sock:ro,z
      - /run/user/${PUID}/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - ~/.local/share/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    devices:
      - /dev/kmsg
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cadvisor.rule=Host(`cadvisor.${DOMAIN_NAME}`)"
      - "traefik.http.routers.cadvisor.entrypoints=websecure"
      - "traefik.http.services.cadvisor.loadbalancer.server.port=8080"
