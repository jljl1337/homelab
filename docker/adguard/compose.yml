services:

  adguard:
    image: docker.io/adguard/adguardhome:v0.107.79
    container_name: homelab-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ${FAST_TEMP_STORAGE}/adguard/work:/opt/adguardhome/work:rw,Z
      - ${FAST_TEMP_STORAGE}/adguard/conf:/opt/adguardhome/conf:rw,Z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard-setup.rule=Host(`adguard-setup.${DOMAIN_NAME}`)"
      - "traefik.http.routers.adguard-setup.entrypoints=websecure"
      - "traefik.http.routers.adguard-setup.service=adguard-setup"
      - "traefik.http.services.adguard-setup.loadbalancer.server.port=3000"
      - "traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN_NAME}`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.service=adguard"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"
