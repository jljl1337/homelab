services:
  immich-server:
    container_name: homelab-immich-server
    image: ghcr.io/immich-app/immich-server:v3.1.0
    restart: unless-stopped
    healthcheck:
      disable: false
    depends_on:
      - redis
      - database
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ${MASS_BACKUP_STORAGE}/data/immich:/data:rw,z
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich-server.rule=Host(`immich.${DOMAIN_NAME}`)
      - traefik.http.routers.immich-server.entrypoints=websecure
      - traefik.http.services.immich-server.loadbalancer.server.port=2283

  immich-machine-learning:
    container_name: homelab-immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-cuda
    restart: unless-stopped
    healthcheck:
      disable: false
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ${FAST_TEMP_STORAGE}/immich/model-cache:/cache:rw,Z

  redis:
    container_name: homelab-immich-redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: homelab-immich-database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${FAST_TEMP_STORAGE}/immich/db:/var/lib/postgresql/data:rw,Z
